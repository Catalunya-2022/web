name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm 10.9.x crashes in Arborist on this dependency tree and the lockfile
      # is regenerated by npm 11; the runner ships npm 10 with Node 22.
      - run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build only typechecks files in the build graph — scripts/ and
      # test files are only covered by tsc.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Committed generated documents are fresh
        # public/documents/*.md are tracked but regenerated by prebuild; a
        # content edit without regeneration would ship stale downloads.
        run: |
          git diff --exit-code -- public/documents
          test -z "$(git status --porcelain -- public/documents)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # npm 10.9.x crashes in Arborist on this dependency tree and the lockfile
      # is regenerated by npm 11; the runner ships npm 10 with Node 22.
      - run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
